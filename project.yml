# XcodeGen project definition — the workflow runs `xcodegen generate` on the
# macOS runner, so the .xcodeproj is never committed (no merge conflicts).
name: DualPlay
options:
  bundleIdPrefix: com.bengx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DualPlay:
    type: application
    platform: iOS
    sources: [DualPlay]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DualPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bengx.dualplay
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  DualPlay:
    build:
      targets:
        DualPlay: all
    run:
      config: Debug
    archive:
      config: Release
