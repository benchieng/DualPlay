name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    # GA image with Xcode 27.x (iOS 27 SDK) — required so iOS 27 treats the
    # app as Duo-ready: pre-27-SDK builds run in a compat canvas instead of
    # filling the unfolded inner display.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode 27.x
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then echo "using $XC"; sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device .app (Release, arm64)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project DualPlay.xcodeproj \
            -scheme DualPlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath derived

      - name: Package artifact
        run: |
          set -euo pipefail
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name 'DualPlay.app')
          test -n "$APP"
          ditto -c -k --keepParent "$APP" DualPlay-unsigned.app.zip
          # .ipa for signing services: zip with the bundle under Payload/
          rm -rf Payload
          mkdir Payload
          ditto "$APP" Payload/DualPlay.app
          ditto -c -k --keepParent Payload DualPlay.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: DualPlay-unsigned
          path: DualPlay-unsigned.app.zip

      # Release assets keep exact filenames on download (chat pipelines
      # content-sniff .ipa files and rename them to .zip).
      - name: Publish rolling release (latest-ci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create latest-ci \
            --title 'DualPlay — latest CI build (unsigned)' \
            --notes 'Unsigned arm64 Release .ipa; sign with your cert before installing.' \
            --prerelease 2>/dev/null || true
          gh release upload latest-ci DualPlay.ipa --clobber
